# The party server behind Dokploy (or any proxy that terminates HTTPS and talks plain HTTP to this stack):
#
#   client ──HTTPS──▶ Traefik (Dokploy: certificate, ports 80/443) ──HTTP──▶ caddy:80 ──▶ app:5177
#
# In Dokploy: create a Compose service from this repository, set the environment (below), and add a domain in its Domains
# tab: host bokau.askn.us, service `caddy`, port 80, HTTPS on (Let's Encrypt). Nothing here publishes a host port.
# Environment: DOMAIN (required) and the optional settings below; Dokploy's Environment tab (or a .env next to this file)
# provides them, and `${NAME}` interpolation passes each one to the app. Nothing is copied into the image.
#
# Locally: `docker compose -f docker-compose.yml -f docker-compose.local.yml up --build`, then http://localhost:8080/play/
services:
  app:
    build: .
    restart: unless-stopped
    # every setting is read from the environment compose runs in with ${NAME} interpolation; a variable left unset takes
    # the default after `:-`
    environment:
      DOBLAJE_MODE: party
      PARTY_URL: https://${DOMAIN:?set DOMAIN (bokau.askn.us)}
      TRUST_PROXY: ${TRUST_PROXY:-2}   # two hops in front: Traefik, then Caddy (see deploy/Caddyfile)
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}   # the AI; empty: the offline generators are used
      SPEND_CAP_USD: ${SPEND_CAP_USD:-3.5}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-qwen/qwen3.7-flash}
      OPENROUTER_FALLBACK_MODEL: ${OPENROUTER_FALLBACK_MODEL:-anthropic/claude-haiku-5.5}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-}                    # workos: hosting a room needs a sign-in (see docs/accounts.md)
      WORKOS_API_KEY: ${WORKOS_API_KEY:-}
      WORKOS_CLIENT_ID: ${WORKOS_CLIENT_ID:-}
      WORKOS_COOKIE_PASSWORD: ${WORKOS_COOKIE_PASSWORD:-}
      LIBRARY_KEY: ${LIBRARY_KEY:-}                      # wraps each clip's data key; openssl rand -base64 32 (docs/accounts.md)
      PARTY_AI_MODEL: ${PARTY_AI_MODEL:-nvidia/nemotron-3-ultra-550b-a55b:free}   # party games: a free model first…
      PARTY_AI_FALLBACK: ${PARTY_AI_FALLBACK:-deepseek/deepseek-v4.1-flash}        # …then a cheap one that tolerates crude players
      PARTY_MAX_ROOMS: ${PARTY_MAX_ROOMS:-20}
      PARTY_CREATES_PER_HOUR: ${PARTY_CREATES_PER_HOUR:-12}
      PARTY_EMPTY_ROOM_MINUTES: ${PARTY_EMPTY_ROOM_MINUTES:-5}
      PARTY_RETENTION_HOURS: ${PARTY_RETENTION_HOURS:-24}
      PARTY_TRANSCRIBE: ${PARTY_TRANSCRIBE:-}
      PARTY_ORIGINS: ${PARTY_ORIGINS:-}
      PARTY_JOIN_URL: ${PARTY_JOIN_URL:-}
    volumes:
      - party-data:/data
    expose:
      - "5177"
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    expose:
      - "80"
volumes:
  party-data:
  caddy-data:
  caddy-config:
